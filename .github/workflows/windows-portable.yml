name: Windows Portable Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Verify
        run: |
          npm run typecheck
          npm run build

      - name: Build portable EXE
        run: npm run dist:portable

      - name: Create starter databases
        run: npm run starter:data

      - name: Smoke test portable EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "Portable EXE was not produced."
          }
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Portable EXE smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Prepare client delivery package
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "Portable EXE was not produced."
          }

          $delivery = "release/BEN MAHMOUD STOCK - CLIENT"
          $backup = Join-Path $delivery "SAUVEGARDES"
          $preparation = "release/PREPARATION - A RETIRER AVANT LIVRAISON"

          New-Item -ItemType Directory -Force -Path $delivery | Out-Null
          New-Item -ItemType Directory -Force -Path $backup | Out-Null
          New-Item -ItemType Directory -Force -Path $preparation | Out-Null

          Copy-Item $exe.FullName (Join-Path $delivery "Ben-Mahmoud-Stock-Portable.exe")
          Copy-Item "docs/LIRE-MOI.txt" (Join-Path $delivery "LIRE-MOI.txt")
          Copy-Item "docs/SAUVEGARDES-README.txt" (Join-Path $backup "README.txt")

          Copy-Item "release/preparation/BASE-CLIENT-VIDE.sqlite3" (Join-Path $preparation "BASE-CLIENT-VIDE.sqlite3")
          Copy-Item "release/preparation/BASE-DEMO-A-REMPLACER.sqlite3" (Join-Path $preparation "BASE-DEMO-A-REMPLACER.sqlite3")
          Copy-Item "docs/preparation/A-REMPLACER-AVANT-CLIENT.txt" (Join-Path $preparation "A-REMPLACER-AVANT-CLIENT.txt")
          Copy-Item "docs/preparation/CONFIGURATION-REELLE-A-COMPLETER.txt" (Join-Path $preparation "CONFIGURATION-REELLE-A-COMPLETER.txt")
          Copy-Item "docs/preparation/PIECES-EXEMPLES.csv" (Join-Path $preparation "PIECES-EXEMPLES.csv")
          Copy-Item "docs/preparation/CLIENTS-EXEMPLES.csv" (Join-Path $preparation "CLIENTS-EXEMPLES.csv")
          Copy-Item "docs/preparation/FOURNISSEURS-EXEMPLES.csv" (Join-Path $preparation "FOURNISSEURS-EXEMPLES.csv")

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: Ben-Mahmoud-Stock-Portable
          path: release/*.exe
          if-no-files-found: error

      - name: Upload client delivery package
        uses: actions/upload-artifact@v4
        with:
          name: Ben-Mahmoud-Stock-Client-Package
          path: release/BEN MAHMOUD STOCK - CLIENT/**
          if-no-files-found: error

      - name: Upload preparation package
        uses: actions/upload-artifact@v4
        with:
          name: Ben-Mahmoud-Stock-Preparation-Package
          path: release/PREPARATION - A RETIRER AVANT LIVRAISON/**
          if-no-files-found: error
