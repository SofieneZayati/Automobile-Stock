name: Windows Portable Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Verify
        run: |
          npm run typecheck
          npm run build

      - name: Build portable EXE
        run: npm run dist:portable

      - name: Smoke test portable EXE
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path release -Filter "*.exe" | Select-Object -First 1
          if (-not $exe) {
            throw "Portable EXE was not produced."
          }
          $process = Start-Process -FilePath $exe.FullName -ArgumentList "--smoke-test" -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "Portable EXE smoke test failed with exit code $($process.ExitCode)."
          }

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: Ben-Mahmoud-Stock-Portable
          path: release/*.exe
          if-no-files-found: error
